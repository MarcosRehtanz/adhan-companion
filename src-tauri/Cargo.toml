[package]
name = "adhan-companion"
version = "0.1.6"
description = "App de escritorio tray-first para Ubuntu: horarios de rezo, adhan y seguimiento — cálculo 100% local"
authors = ["Marcos Rehtanz"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "adhan_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock"] }
# zbus: D-Bus — la conexión de login1 (org.freedesktop.login1 PrepareForSleep)
# se usa con la API blocking en un thread dedicado (spike 2)
zbus = { version = "5", features = ["blocking"] }
rodio = { version = "0.23", default-features = false, features = ["playback", "wav"] }
tauri-plugin-notification = "2.6.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
