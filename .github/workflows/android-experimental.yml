name: Android experimental

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publicar una prerelease con descarga directa del APK'
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'index.html'
      - 'vite.config.ts'
      - '.github/workflows/android-experimental.yml'

permissions:
  contents: read

concurrency:
  group: android-experimental-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: build-apk-${{ matrix.arch }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64
            rust_target: aarch64-linux-android
            abi: arm64-v8a
          - arch: armv7
            target: armv7
            rust_target: armv7-linux-androideabi
            abi: armeabi-v7a
    env:
      NDK_VERSION: '27.2.12479018'
      ANDROID_EXPERIMENTAL_VERSION_CODE: ${{ github.run_number + 10000 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android-${{ matrix.arch }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android toolchain
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Fetch locked Android dependencies
        run: cargo fetch --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.rust_target }}
      - name: Build experimental APK
        run: pnpm tauri android build --debug --apk --target ${{ matrix.target }} --ci
      - name: Sign APK with persistent experimental key
        shell: bash
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY_SIGN'
          import base64
          import os
          import subprocess
          import tempfile
          from pathlib import Path

          for name in ('ANDROID_KEY_BASE64', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD'):
              if not os.environ.get(name):
                  raise SystemExit(f'Missing required Actions secret: {name}')
          apks = list(Path('src-tauri/gen/android/app/build/outputs/apk').rglob('*-debug.apk'))
          if len(apks) != 1:
              raise SystemExit(f'Expected one APK for signing, found {len(apks)}')
          signer = Path(os.environ['ANDROID_HOME']) / 'build-tools/36.0.0/apksigner'
          # Clave en RUNNER_TEMP, fuera del checkout y de las cachés de Gradle.
          with tempfile.TemporaryDirectory(prefix='adhan-signing-', dir=os.environ['RUNNER_TEMP']) as directory:
              key = Path(directory) / 'experimental.p12'
              key.write_bytes(base64.b64decode(''.join(os.environ['ANDROID_KEY_BASE64'].split()), validate=True))
              key.chmod(0o600)
              signed = apks[0].with_suffix('.signed.apk')
              subprocess.run([
                  str(signer), 'sign', '--ks', str(key), '--ks-type', 'PKCS12',
                  '--ks-key-alias', os.environ['ANDROID_KEY_ALIAS'],
                  '--ks-pass', 'env:ANDROID_KEY_PASSWORD', '--key-pass', 'env:ANDROID_KEY_PASSWORD',
                  '--out', str(signed), str(apks[0]),
              ], check=True)
              subprocess.run([str(signer), 'verify', '--verbose', str(signed)], check=True)
              signed.replace(apks[0])
          PY_SIGN
      - name: Prepare APK and checksum
        shell: bash
        env:
          APK_ARCH: ${{ matrix.arch }}
          APK_ABI: ${{ matrix.abi }}
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          import shutil
          import zipfile
          from pathlib import Path
          apks = list(Path('src-tauri/gen/android/app/build/outputs/apk').rglob('*-debug.apk'))
          if len(apks) != 1:
              raise SystemExit(f'Expected one experimental APK, found {apks}')
          with zipfile.ZipFile(apks[0]) as archive:
              native = {name.split('/')[1] for name in archive.namelist() if name.startswith('lib/') and name.endswith('.so')}
              expected = os.environ['APK_ABI']
              if native != {expected} or f'lib/{expected}/libadhan_companion_lib.so' not in archive.namelist():
                  raise SystemExit(f'Expected native libraries for {expected}, found {native}')
          destination = Path('android-experimental')
          destination.mkdir()
          arch = os.environ['APK_ARCH']
          apk = destination / f'Adhan-Companion-android-experimental-{arch}-{os.environ["GITHUB_SHA"][:7]}.apk'
          shutil.copy2(apks[0], apk)
          with apk.open('rb') as source:
              digest = hashlib.file_digest(source, 'sha256').hexdigest()
          (destination / f'SHA256SUMS-{arch}').write_text(f'{digest}  {apk.name}\n')
          shutil.copy2('docs/android-experimental.md', destination / 'LEEME.md')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: android-experimental-${{ matrix.arch }}
          path: android-experimental/
          if-no-files-found: error
          retention-days: 30

  publish-experimental:
    needs: build-apk
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish_release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: android-experimental-*
          merge-multiple: true
          path: android-experimental
      - name: Prepare release checksums
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          root = Path('android-experimental')
          apks = sorted(root.glob('*.apk'))
          if len(apks) != 2:
              raise SystemExit(f'Expected ARM64 and ARMv7 APKs, found {apks}')
          with (root / 'SHA256SUMS').open('w') as sums:
              for apk in apks:
                  with apk.open('rb') as source:
                      digest = hashlib.file_digest(source, 'sha256').hexdigest()
                  sums.write(f'{digest}  {apk.name}\n')
          PY
      - name: Publish experimental prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="android-experimental-${GITHUB_SHA:0:7}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "La prerelease de este commit ya existe; se conserva su APK y firma originales."
            exit 0
          fi
          version=$(node -p "require('./package.json').version")
          gh release create "$tag" android-experimental/*.apk android-experimental/SHA256SUMS android-experimental/LEEME.md \
            --target "$GITHUB_SHA" \
            --title "Android experimental v$version (${GITHUB_SHA:0:7})" \
            --notes-file docs/releases/android-experimental.md \
            --prerelease --latest=false
