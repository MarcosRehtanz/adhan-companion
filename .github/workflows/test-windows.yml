name: Test Windows Installer

on:
  push:
    branches:
      - 'fix/windows-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-windows:
    name: test-windows-installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate release version and notes
        run: node scripts/check-release.mjs

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Test Windows core
        run: cargo test --locked --all-targets --manifest-path src-tauri/Cargo.toml

      - name: Build Windows installer
        run: |
          pnpm tauri build --ci --bundles nsis -- --locked

      - name: Test Windows installer lifecycle (clean install, update while running, and uninstall while running)
        shell: pwsh
        run: |
          $installer = Get-Item "src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (!$installer) { throw "No se encontro el archivo *-setup.exe en bundle/nsis" }
          Write-Host "Probando instalador: $($installer.FullName)"
          
          $targetDir = "$env:LOCALAPPDATA\Adhan Companion"
          Write-Host "Destino previsto: $targetDir"
          
          # 1. Instalación inicial silenciosa especificando /D
          Write-Host "==> Paso 1: Instalación inicial silenciosa (/S /D=$targetDir)..."
          # En NSIS, /D debe ser el último argumento y sin comillas
          $p = Start-Process -FilePath $installer.FullName -ArgumentList "/S", "/D=$targetDir" -Wait -PassThru
          Write-Host "Proceso de instalacion finalizo con codigo de salida: $($p.ExitCode)"
          
          # Dar unos segundos por si algún worker en segundo plano finaliza
          Start-Sleep -Seconds 5
          
          # Comprobar contenido del directorio destino
          if (Test-Path $targetDir) {
            Write-Host "Contenido de $($targetDir):"
            Get-ChildItem -Path $targetDir | ForEach-Object { Write-Host " - $($_.Name)" }
          } else {
            Write-Host "ADVERTENCIA: $targetDir no existe tras la instalacion."
            Write-Host "Buscando 'Adhan Companion.exe' en el sistema:"
            Get-ChildItem -Path "$env:USERPROFILE" -Filter "*Adhan Companion*" -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Write-Host " Encontrado: $($_.FullName)" }
          }
          
          $appExe = "$targetDir\Adhan Companion.exe"
          if (!(Test-Path $appExe)) {
            $fallback = Get-ChildItem -Path "$env:LOCALAPPDATA" -Filter "Adhan Companion.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($fallback) {
              $appExe = $fallback.FullName
              $targetDir = $fallback.DirectoryName
              Write-Host "Fallback encontrado: $appExe"
            } else {
              throw "No se pudo encontrar Adhan Companion.exe en el sistema tras la instalación"
            }
          }
          Write-Host "✔ App instalada correctamente en $targetDir ($appExe)"
          
          # 2. Iniciar la aplicación en segundo plano (simulando bandeja del sistema)
          Write-Host "==> Paso 2: Iniciando Adhan Companion en segundo plano..."
          $appProc = Start-Process -FilePath $appExe -PassThru
          Start-Sleep -Seconds 5
          $running = Get-Process -Name "Adhan Companion" -ErrorAction SilentlyContinue
          if (!$running) { throw "El proceso no inició en segundo plano" }
          Write-Host "✔ Proceso corriendo con PID $($running.Id)"
          
          # 3. Probar actualización encima mientras la app está corriendo (/S /UPDATE /P)
          Write-Host "==> Paso 3: Probando actualización encima con la app en ejecución..."
          $updateProc = Start-Process -FilePath $installer.FullName -ArgumentList "/S", "/UPDATE", "/P" -Wait -PassThru
          Write-Host "Actualizador finalizo con codigo: $($updateProc.ExitCode)"
          Start-Sleep -Seconds 5
          
          # 4. Iniciar la app de nuevo y probar desinstalación mientras corre
          Write-Host "==> Paso 4: Iniciando la app y probando desinstalación mientras corre..."
          $appProc2 = Start-Process -FilePath $appExe -PassThru
          Start-Sleep -Seconds 5
          $uninstaller = Join-Path $targetDir "Uninstall Adhan Companion.exe"
          if (!(Test-Path $uninstaller)) {
            $uninstaller = Get-ChildItem -Path $targetDir -Filter "*uninstall*.exe" | Select-Object -First 1 -ExpandProperty FullName
          }
          if (!$uninstaller -or !(Test-Path $uninstaller)) { throw "No se encontró el desinstalador en $targetDir" }
          
          Write-Host "Ejecutando desinstalador: $uninstaller"
          $uninstProc = Start-Process -FilePath $uninstaller -ArgumentList "/S", "_?=$targetDir" -Wait -PassThru
          Write-Host "Desinstalador finalizo con codigo: $($uninstProc.ExitCode)"
          Start-Sleep -Seconds 3
          
          $stillRunning = Get-Process -Name "Adhan Companion" -ErrorAction SilentlyContinue
          if ($stillRunning) { throw "El proceso sigue en ejecución después de desinstalar" }
          Write-Host "✔ Desinstalación completada exitosamente; proceso finalizado sin errores"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer-tested
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
