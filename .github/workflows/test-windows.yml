name: Test Windows Installer

on:
  push:
    branches:
      - 'fix/windows-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-windows:
    name: test-windows-installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate release version and notes
        run: node scripts/check-release.mjs

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Test Windows core
        run: cargo test --locked --all-targets --manifest-path src-tauri/Cargo.toml

      - name: Build Windows installer
        run: |
          pnpm tauri build --ci --bundles nsis -- --locked

      - name: Test Windows installer lifecycle (clean install, update while running, and uninstall while running)
        shell: pwsh
        run: |
          $installer = Get-Item "src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (!$installer) { throw "No se encontro el archivo *-setup.exe en bundle/nsis" }
          Write-Host "Probando instalador: $($installer.FullName)"
          
          # 1. Instalación inicial silenciosa
          Write-Host "==> Paso 1: Instalación inicial silenciosa (/S)..."
          Start-Process -FilePath $installer.FullName -ArgumentList "/S"
          
          # Esperar a que el instalador de fondo termine de extraer y copiar los archivos (NSIS se desacopla)
          $appExe = $null
          $installDir = $null
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 2
            $candidates = @(
              "$env:LOCALAPPDATA\Adhan Companion\Adhan Companion.exe",
              "$env:LOCALAPPDATA\Programs\Adhan Companion\Adhan Companion.exe"
            )
            foreach ($cand in $candidates) {
              if (Test-Path $cand) {
                $appExe = $cand
                $installDir = Split-Path -Parent $cand
                break
              }
            }
            if ($appExe) { break }
          }
          if (!$appExe) {
            $found = Get-ChildItem -Path "$env:LOCALAPPDATA" -Filter "Adhan Companion.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) {
              $appExe = $found.FullName
              $installDir = $found.DirectoryName
            } else {
              throw "No se encontró el ejecutable instalado tras esperar a NSIS"
            }
          }
          # Esperar a que termine cualquier proceso residual del instalador
          while (Get-Process | Where-Object { $_.ProcessName -like "*setup*" -and $_.Id -ne $PID }) {
            Start-Sleep -Seconds 1
          }
          Write-Host "✔ App instalada correctamente en $installDir ($appExe)"
          
          # 2. Iniciar la aplicación en segundo plano (simulando bandeja del sistema)
          Write-Host "==> Paso 2: Iniciando Adhan Companion en segundo plano..."
          $appProc = Start-Process -FilePath $appExe -PassThru
          Start-Sleep -Seconds 4
          $running = Get-Process -Name "Adhan Companion" -ErrorAction SilentlyContinue
          if (!$running) { throw "El proceso no inició en segundo plano" }
          Write-Host "✔ Proceso corriendo con PID $($running.Id)"
          
          # 3. Probar actualización encima mientras la app está corriendo (/S /UPDATE /P)
          Write-Host "==> Paso 3: Probando actualización encima con la app en ejecución..."
          Start-Process -FilePath $installer.FullName -ArgumentList "/S", "/UPDATE", "/P"
          Start-Sleep -Seconds 3
          # Esperar a que termine la actualización
          for ($i = 0; $i -lt 30; $i++) {
            $activeSetup = Get-Process | Where-Object { $_.ProcessName -like "*setup*" -and $_.Id -ne $PID }
            if (!$activeSetup) { break }
            Start-Sleep -Seconds 2
          }
          if (Get-Process | Where-Object { $_.ProcessName -like "*setup*" -and $_.Id -ne $PID }) {
            throw "El instalador quedó bloqueado durante la actualización"
          }
          Write-Host "✔ Actualización completada exitosamente sin bloquearse"
          
          # 4. Volver a iniciar la app y probar desinstalación mientras corre
          Write-Host "==> Paso 4: Iniciando la app y probando desinstalación mientras corre..."
          $appProc2 = Start-Process -FilePath $appExe -PassThru
          Start-Sleep -Seconds 4
          $uninstaller = Join-Path $installDir "Uninstall Adhan Companion.exe"
          if (!(Test-Path $uninstaller)) {
            $uninstaller = Get-ChildItem -Path $installDir -Filter "*uninstall*.exe" | Select-Object -First 1 -ExpandProperty FullName
          }
          if (!$uninstaller -or !(Test-Path $uninstaller)) { throw "No se encontró el desinstalador en $installDir" }
          
          Write-Host "Ejecutando desinstalador: $uninstaller"
          # NSIS uninstaller: _?= evita que se copie a TEMP y permite esperar de forma síncrona
          $uninstProc = Start-Process -FilePath $uninstaller -ArgumentList "/S", "_?=$installDir" -Wait -PassThru
          Start-Sleep -Seconds 2
          
          $stillRunning = Get-Process -Name "Adhan Companion" -ErrorAction SilentlyContinue
          if ($stillRunning) { throw "El proceso sigue en ejecución después de desinstalar" }
          Write-Host "✔ Desinstalación completada exitosamente; proceso finalizado sin errores"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer-tested
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
