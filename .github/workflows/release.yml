name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate release version and notes
        run: node scripts/check-release.mjs
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev libasound2-dev patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Test Linux core
        run: cargo test --locked --all-targets --manifest-path src-tauri/Cargo.toml

      - name: Build Linux bundles
        run: |
          pnpm tauri build --ci --bundles deb,appimage -- --locked

      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate release version and notes
        run: node scripts/check-release.mjs
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Test Windows core
        run: cargo test --locked --all-targets --manifest-path src-tauri/Cargo.toml

      - name: Build Windows installer
        run: |
          pnpm tauri build --ci --bundles nsis -- --locked

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  release:
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify bundles and generate checksums
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          root = Path("release-assets")
          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          bundles = []
          for pattern in ("*.deb", "*.AppImage", "*-setup.exe"):
              matches = list(root.rglob(pattern))
              if len(matches) != 1 or version not in matches[0].name:
                  raise SystemExit(f"Expected exactly one v{version} bundle for {pattern}, found: {matches}")
              bundles.extend(matches)
          with (root / "SHA256SUMS").open("w") as sums:
              for path in sorted(bundles):
                  digest = hashlib.sha256(path.read_bytes()).hexdigest()
                  sums.write(f"{digest}  {path.name}\n")
          PY

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**
          body_path: docs/releases/${{ github.ref_name }}.md
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
