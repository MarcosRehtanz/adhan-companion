name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      guia:
        description: "Versión de prueba con la guía del rezo visible (VITE_GUIA_REZO=1). Nunca para una versión oficial."
        type: boolean
        default: false
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # Solo una ejecución manual con «guia» marcada enciende la guía; los tags y los PR la dejan apagada
  # y su código ni entra en el paquete.
  VITE_GUIA_REZO: ${{ github.event_name == 'workflow_dispatch' && inputs.guia && '1' || '' }}

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate release version and notes
        run: node scripts/check-release.mjs
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev libasound2-dev patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Test Linux core
        run: cargo test --locked --all-targets --manifest-path src-tauri/Cargo.toml

      - name: Build Linux bundles
        run: |
          pnpm tauri build --ci --bundles deb,appimage -- --locked

      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate release version and notes
        run: node scripts/check-release.mjs
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Test Windows core
        run: cargo test --locked --all-targets --manifest-path src-tauri/Cargo.toml

      - name: Build Windows installer
        run: |
          pnpm tauri build --ci --bundles nsis -- --locked

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  build-android:
    # Firmar únicamente código de ramas del propio repositorio o tags oficiales.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: build-android-${{ matrix.arch }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64
            rust_target: aarch64-linux-android
            abi: arm64-v8a
          - arch: armv7
            target: armv7
            rust_target: armv7-linux-androideabi
            abi: armeabi-v7a
    env:
      NDK_VERSION: '27.2.12479018'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android-${{ matrix.arch }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android toolchain
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Fetch locked Android dependencies
        run: cargo fetch --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.rust_target }}
      - name: Set official version code
        run: echo "ANDROID_VERSION_CODE=$(python3 scripts/android-release.py version-code)" >> "$GITHUB_ENV"
      - name: Build release APK
        run: pnpm tauri android build --apk --target ${{ matrix.target }} --ci
      - name: Verify and sign official APK
        env:
          APK_ARCH: ${{ matrix.arch }}
          APK_ABI: ${{ matrix.abi }}
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 scripts/android-release.py prepare
      - uses: actions/upload-artifact@v4
        with:
          name: android-official-${{ matrix.arch }}
          path: android-official/
          if-no-files-found: error
          retention-days: 30

  release:
    needs: [build-linux, build-windows, build-android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Assemble Android update index
        run: python3 scripts/android-release.py merge

      - name: Verify bundles and generate checksums
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          root = Path("release-assets")
          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          bundles = []
          for pattern in ("*.deb", "*.AppImage", "*-setup.exe", "*_android-arm64.apk", "*_android-armv7.apk"):
              matches = list(root.rglob(pattern))
              if len(matches) != 1 or version not in matches[0].name:
                  raise SystemExit(f"Expected exactly one v{version} bundle for {pattern}, found: {matches}")
              bundles.extend(matches)
          with (root / "SHA256SUMS").open("w") as sums:
              bundles.append(root / "android-update.json")
              for path in sorted(bundles):
                  normalized = path.with_name(path.name.replace(" ", "."))
                  if normalized != path:
                      path.rename(normalized)
                  path = normalized
                  digest = hashlib.sha256(path.read_bytes()).hexdigest()
                  sums.write(f"{digest}  {path.name}\n")
          PY

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**
          body_path: docs/releases/${{ github.ref_name }}.md
          fail_on_unmatched_files: true
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare migration bridge for installed experimental apps
        run: python3 scripts/android-release.py bridge
      - name: Publish migration bridge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="android-experimental-${GITHUB_SHA:0:7}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "El puente de este commit ya existe; se conservan sus artefactos."
            exit 0
          fi
          gh release create "$tag" android-bridge/*.apk android-bridge/android-update.json android-bridge/SHA256SUMS \
            --target "$GITHUB_SHA" --title "Puente Android al release $GITHUB_REF_NAME" \
            --notes-file android-bridge/notes.md --prerelease --latest=false
